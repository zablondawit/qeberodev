name: Pipeline
on:
    push:
        branches: [main]
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/web
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Setup Nodejs
              uses: actions/setup-node@v2
              with:
                  node-version: "14"
            - name: Install
              run: |
                  npm install
            - name: Build Artifact
              run: npm run build
